<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENGUINWORLD | HOME</title>

    <style>
        .button-box {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .button-box:hover {
            background-color: #0056b3;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333333;
        }

        header {
            background: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            text-align: center;
        }

        main {
            background: #ffffff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
        }

        section {
            background: #eef2f7;
            padding: 15px;
            margin-top: 20px;
            border-left: 5px solid #0066cc;
            border-radius: 3px;
        }

        button {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        button:hover {
            background-color: #004da0;
        }
    </style>
</head>

<body>

    <header>
        <h1>PenguinWorld</h1>
    </header>

    <main>
        <h2>PenguinWorld</h2>
        <p>PenguinWorld is a broadcasting system where penguins alert other penguins about something.</p>

        <a href="https://penguinworld.vercel.app/new.html" class="button-box">
            BROADCAST A PENGUIN ALERT
        </a>

        <button>Just click. it dosent matter.</button>

        <section>
            <h3>Code</h3>
            <p>This is used with HTML (Hypertext Markup Language).</p>
        </section>
    </main>

</body>
</html>
